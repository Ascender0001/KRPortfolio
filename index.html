<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mirrors src/motion.ts so html[data-motion] is set before first paint.
      try {
        var m = localStorage.getItem("kr-motion");
        document.documentElement.dataset.motion =
          m === "full" || m === "reduced" ? m
          : matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full";
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Király Róbert személyes portfóliója. Web- és játékfejlesztési projektek, tapasztalat, készségek és elérhetőségek."
    />
    <title>Király Róbert | Portfólió</title>
    <link rel="canonical" href="https://ascender.codes/" />
    <meta name="theme-color" content="#0a0a0a" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ascender.codes/" />
    <meta property="og:site_name" content="Király Róbert" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:title" content="Király Róbert | Portfólió" />
    <meta
      property="og:description"
      content="Informatika szakos hallgató. Web- és játékfejlesztési projektek, tapasztalat, készségek és elérhetőségek."
    />
    <meta name="twitter:card" content="summary" />

      content="Informatika szakos hallgató. Web- és játékfejlesztési projektek, tapasztalat, készségek és elérhetőségek."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
  </head>

</html>
